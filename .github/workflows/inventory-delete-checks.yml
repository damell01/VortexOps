name: Inventory deletion checks
on:
  pull_request:
    branches: [Production]
    paths:
      - 'app/Filament/Resources/InventoryItemResource.php'
      - 'app/Filament/Resources/InventoryItemResource/**'
      - 'app/Services/InventoryItemDeleter.php'
      - 'tests/Feature/Inventory/InventoryItemDeleteTest.php'
      - '.github/workflows/inventory-delete-checks.yml'
      - 'tests/Browser/inventory-audit.spec.ts'
      - 'tests/Browser/fixtures/inventory-audit.php'
jobs:
  deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env
      - name: Detail, edit and catalog deletion regression checks
        run: php artisan test tests/Feature/Inventory/InventoryItemDeleteTest.php tests/Feature/Inventory/DeletedItemStockTest.php
  browser:
    name: Inventory detail deletion in desktop and mobile browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:3P8d9fK5jjdq1DdRwrn9PkiikXcuF/OFu80W3RN9dmw=
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/inventory-audit.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare isolated inventory fixtures
        run: |
          cp .env.example .env
          mkdir -p storage/framework/testing
          touch /tmp/inventory-audit.sqlite
          php artisan migrate --force
          php tests/Browser/fixtures/inventory-audit.php
      - name: Exercise inventory user workflows
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/inventory-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/admin/login >/dev/null && break; sleep 2; done
          npx playwright test --config=playwright.inventory-audit.config.ts --grep 'detail-page delete names the item' --max-failures=3 || { cat /tmp/inventory-server.log; tail -n 100 storage/logs/laravel.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-detail-delete-browser-results
          path: tests/Browser/output/inventory-audit
