name: Inventory popup review checks
on:
  push:
    branches: [fix/inventory-popup-review-race]
  pull_request:
    branches: [Production]
jobs:
  deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env
      - name: Compile and syntax-check all Blade views
        run: |
          php artisan view:clear
          php artisan view:cache
          find storage/framework/views -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Detail, edit and catalog deletion regression checks
        run: php artisan test tests/Feature/InventoryPopupReviewTest.php tests/Feature/InventoryPriceAlertsTest.php tests/Feature/InventoryPopupSettingsTest.php
