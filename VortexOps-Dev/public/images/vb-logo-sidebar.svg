<svg viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Vortex Breaks horizontal logo for the dark sidebar.
    Mark on the left, "VORTEX" + "BREAKS" text on the right.
  -->

  <!-- ── Logo mark (scaled to 48×48, left-aligned) ── -->
  <g transform="translate(4, 4) scale(0.4)">
    <defs>
      <mask id="sm">
        <rect width="100" height="100" fill="white"/>
        <rect x="0" y="19.5" width="100" height="9" fill="black"/>
      </mask>
    </defs>
    <!-- Outer triangle (masked so inner top bar goes over it) -->
    <path
      mask="url(#sm)"
      d="M 23,15 L 77,15 Q 87,15 82,25 L 53,80 Q 50,87 47,80 L 18,25 Q 13,15 23,15 Z"
      stroke="#f0ece6" stroke-width="5.5" stroke-linejoin="round" fill="none"
    />
    <!-- Inner triangle -->
    <path
      d="M 30,24 L 70,24 Q 79,24 74.5,32 L 52.5,75 Q 50,81 47.5,75 L 25.5,32 Q 21,24 30,24 Z"
      stroke="#f0ece6" stroke-width="5" stroke-linejoin="round" fill="none"
    />
    <!-- Outer top bar on top -->
    <path d="M 23,15 L 77,15" stroke="#f0ece6" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Inner top bar on top (key interlocking layer) -->
    <path d="M 30,24 L 70,24" stroke="#f0ece6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ── Text: VORTEX ── -->
  <text
    x="52" y="22"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="15"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#ffffff"
  >VORTEX</text>

  <!-- ── Text: BREAKS ── -->
  <text
    x="53" y="37"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="2"
    fill="#c4b5fd"
  >BREAKS</text>
</svg>
