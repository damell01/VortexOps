<!doctype html><html><head><meta charset="utf-8"><title>Vortex Whatnot Sync</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:780px;margin:42px auto;padding:0 24px}.card{background:white;border:1px solid #dfe5ee;border-radius:16px;padding:24px;box-shadow:0 8px 30px #17203310;margin-bottom:18px}h1{margin:0 0 6px}.muted{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap}input{padding:12px;border:1px solid #cfd7e3;border-radius:9px;flex:1;min-width:300px}button{padding:12px 18px;border:0;border-radius:9px;background:#172033;color:white;font-weight:650;cursor:pointer}.primary{background:#16a34a}pre{height:250px;overflow:auto;background:#0f172a;color:#dbeafe;padding:14px;border-radius:10px;white-space:pre-wrap}.status{font-weight:700}</style></head><body><div class="wrap"><div class="card"><h1>Vortex Whatnot Sync</h1><div class="muted">Desktop companion for Vortex Ops</div></div><div class="card"><div class="status" id="status">Checking setup…</div><p class="muted" id="computer"></p><div class="row"><input id="token" type="password" placeholder="Vortex collector API token"><button id="save">Save Connection</button></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><div class="row"><button id="login">1. Connect Whatnot</button><button class="primary" id="sync">2. Test Sync</button><button id="stop">Stop</button></div><p class="muted">First time: save the token, connect Whatnot, log into Seller Hub, close Chrome, then click Test Sync.</p></div><div class="card"><b>Activity</b><pre id="log">Ready.</pre></div></div><script>const q=x=>document.querySelector(x),log=q('#log');function add(x){log.textContent+='\n'+x;log.scrollTop=log.scrollHeight}async function refresh(){const s=await vortex.state();q('#status').textContent=s.configured?'✓ Vortex Ops connected':'Setup required';q('#computer').textContent='Computer: '+s.computer+' · '+s.apiUrl}q('#save').onclick=async()=>{const r=await vortex.saveToken(q('#token').value);add(r.ok?'Connection saved.':'Token required.');refresh()};q('#login').onclick=async()=>{add('Opening dedicated Whatnot Chrome…');const r=await vortex.login();add('Chrome login closed (exit '+r.code+').')};q('#sync').onclick=async()=>{add('Starting test sync…');const r=await vortex.sync();add(r.code===0?'✓ Sync completed.':'✗ Sync exited '+r.code)};q('#stop').onclick=()=>vortex.stop();vortex.onLog(add);refresh();</script></body></html>
