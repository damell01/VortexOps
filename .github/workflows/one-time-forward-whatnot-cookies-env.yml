name: One-time patch Whatnot auth preflight

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/one-time-forward-whatnot-cookies-env.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
      - name: Patch Whatnot auth preflight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/whatnot-scraper.cjs')
          text = path.read_text()

          old_auth = """    if (hasCookieFile && MODE !== 'cookie-test' && MODE !== 'dump-cookies' && MODE !== 'path-probe' && MODE !== 'api-discover') {\n      await page.goto(URLS.sellerHub, { waitUntil: 'domcontentloaded', timeout: 20000 });\n      await page.waitForLoadState('networkidle', { timeout: 6000 }).catch(() => {});\n"""
          new_auth = """    if (hasCookieFile && MODE !== 'cookie-test' && MODE !== 'dump-cookies' && MODE !== 'path-probe' && MODE !== 'api-discover') {\n      // Validate the restored session on the public Whatnot shell first. Seller Hub\n      // itself can be Cloudflare-challenged even when the authenticated session is\n      // valid, which used to stop channel switching before it even had a chance to\n      // run. A redirect from / to /login is still decisive evidence of an expired\n      // session; otherwise channel-specific runs verify the requested role directly.\n      await page.goto(URLS.home, { waitUntil: 'domcontentloaded', timeout: 20000 });\n      await page.waitForLoadState('networkidle', { timeout: 6000 }).catch(() => {});\n"""
          if old_auth not in text:
              raise SystemExit('Expected cookie-auth Seller Hub preflight block not found; refusing to patch')
          text = text.replace(old_auth, new_auth, 1)

          old_ensure = """async function ensureSellerMode(page) {\n  const pageText = await page.evaluate(() =>\n"""
          new_ensure = """async function ensureSellerMode(page) {\n  // For a channel-scoped run, do not navigate to Seller Hub merely to prove\n  // seller mode. The role picker on the already-authenticated Whatnot shell is\n  // enough to establish seller context, and switchToChannel verifies the active\n  // username before any scrape is allowed to continue. This keeps attribution\n  // fail-closed while avoiding an unnecessary /dashboard/home Cloudflare gate.\n  if (CHANNEL_NAME) {\n    info(`ensureSellerMode: channel requested — switching directly from current authenticated page to @${CHANNEL_NAME}`);\n    await switchToChannel(page, CHANNEL_NAME);\n    global._sellerModeActive = true;\n    return;\n  }\n\n  const pageText = await page.evaluate(() =>\n"""
          if old_ensure not in text:
              raise SystemExit('Expected ensureSellerMode function start not found; refusing to patch')
          text = text.replace(old_ensure, new_ensure, 1)

          path.write_text(text)
          PY
          node --check scripts/whatnot-scraper.cjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- scripts/whatnot-scraper.cjs; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/whatnot-scraper.cjs
          git commit -m "fix(scraper): bypass challenged seller hub auth preflight"
          git push origin Dev
