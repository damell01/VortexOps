name: Payroll UI Screenshots

on:
  pull_request:
    branches:
      - Dev
    paths:
      - 'app/**'
      - 'resources/**'
      - 'database/**'
      - 'routes/**'
      - 'tests/Browser/payroll-screenshot.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/payroll-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare application
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          npm run build

      - name: Start application
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/vortexops-payroll-screenshots.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/admin/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vortexops-payroll-screenshots.log
          exit 1

      - name: Capture payroll screenshots
        run: npx playwright test tests/Browser/payroll-screenshot.spec.ts --project=desktop

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: payroll-ui-screenshots
          path: tests/Browser/screenshots/payroll/*.png
          if-no-files-found: error

      - name: Commit refreshed screenshots to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Browser/screenshots/payroll/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Refresh payroll UI screenshots [payroll screenshots]"
          git push origin HEAD:${{ github.head_ref }}
