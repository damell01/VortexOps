name: one-time-add-steel-backend

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-add-steel-backend.yml'
      - '.github/scripts/patch-steel-backend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Steel backend support
        run: python3 .github/scripts/patch-steel-backend.py

      - name: Validate syntax
        run: |
          node --check scripts/whatnot-scraper.cjs
          php -l app/Services/WhatnotScraper.php
          php -l config/vortex.php

      - name: Commit Steel backend integration and clean one-time helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/one-time-add-steel-backend.yml
          rm -f .github/scripts/patch-steel-backend.py
          rm -f .github/workflows/one-time-bypass-analytics-preflight.yml
          rm -f .github/trigger-preflight-patch.txt

          git add -A
          git commit -m 'feat(scraper): add self-hosted Steel browser backend'
          git push origin Dev
