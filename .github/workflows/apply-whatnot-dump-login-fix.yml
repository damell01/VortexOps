name: Apply Whatnot credential renewal fix

on:
  push:
    branches: [Dev]
    paths:
      - 'scripts/.apply-whatnot-dump-login-fix.py'
      - '.github/workflows/apply-whatnot-dump-login-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 scripts/.apply-whatnot-dump-login-fix.py
      - name: Validate scraper
        run: |
          node --check scripts/whatnot-scraper.cjs
          git diff --check
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/.apply-whatnot-dump-login-fix.py
          rm .github/workflows/apply-whatnot-dump-login-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs scripts/.apply-whatnot-dump-login-fix.py .github/workflows/apply-whatnot-dump-login-fix.yml
          git commit -m 'fix(auth): make Whatnot renewal perform real login'
          git push origin Dev
