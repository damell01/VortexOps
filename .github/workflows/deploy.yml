name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/vortexops

jobs:
  build-push:
    name: Build & push Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: build-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Push docker-compose.yml so the VPS never needs a repo clone.
      # This is the only file the server needs — the image comes from GHCR.
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/vortexops/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vortexops

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new image
            docker pull ${{ env.IMAGE }}:latest

            # Restart services.
            # --env-file is required so ${VAR} substitutions in docker-compose.yml
            # resolve from .env.docker rather than falling back to hard-coded defaults,
            # which would override env_file values (environment: takes precedence).
            docker compose --env-file .env.docker pull
            docker compose --env-file .env.docker up -d --remove-orphans

            # Run migrations inside the app container
            docker compose --env-file .env.docker exec -T app php artisan migrate --force

            # Optimize caches
            docker compose --env-file .env.docker exec -T app php artisan optimize
            docker compose --env-file .env.docker exec -T app php artisan filament:optimize

            echo "Deployment complete — $(date -u)"
