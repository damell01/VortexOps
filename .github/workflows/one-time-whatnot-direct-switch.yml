name: One-time direct Whatnot role switch

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-direct-switch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Patch direct role switch path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/whatnot-scraper.cjs')
          s=p.read_text()

          marker = '''  // Confirmed July 2026 (real markup): no id at all — it's an h4 with class ogVNN\n  // reading "Switch Role", inside a div.eCoev[role="presentation"] menu row.\n  const SWITCH_ROLE_SEL = '#team-invite-switch-role-anchor, div.eCoev h4.ogVNN';\n'''
          insert = '''  // Current Whatnot UI exposes everything we need directly: the active profile\n  // avatar has alt="<username>", Switch Role has a stable id, and each role row\n  // contains img.z-avatar-image[alt="<username>"]. Use that exact path first\n  // instead of enumerating a dozen generic profile/menu selectors.\n  const SWITCH_ROLE_SEL = '#team-invite-switch-role-anchor, div.eCoev h4.ogVNN';\n  const activeBeforeDirect = await getActiveChannelUsername(page);\n  if (activeBeforeDirect) {\n    const profileSelector = `img.z-avatar-image[alt="${activeBeforeDirect}"][width="40"][height="40"]`;\n    const profileAvatar = page.locator(profileSelector).first();\n    if (await profileAvatar.isVisible({ timeout: 1500 }).catch(() => false)) {\n      info(`switchToChannel: direct path clicking active profile avatar alt="${activeBeforeDirect}"`);\n      await profileAvatar.click({ force: true, timeout: 3000 }).catch(async () => {\n        await profileAvatar.evaluate(el => el.click()).catch(() => {});\n      });\n\n      const directSwitchRole = page.locator('#team-invite-switch-role-anchor').first();\n      if (await directSwitchRole.isVisible({ timeout: 4000 }).catch(() => false)) {\n        info('switchToChannel: direct path clicking #team-invite-switch-role-anchor');\n        await directSwitchRole.click({ force: true, timeout: 3000 });\n\n        const directTarget = page.locator(`button:has(img.z-avatar-image[alt="${channelName.toLowerCase()}"])`).first();\n        if (await directTarget.isVisible({ timeout: 5000 }).catch(() => false)) {\n          info(`switchToChannel: direct path clicking target role @${channelName}`);\n          await directTarget.click({ force: true, timeout: 3000 });\n\n          const verifiedDirect = await waitForActiveChannel(page, channelName, Math.min(SWITCH_CHANNEL_TIMEOUT_MS, 15000));\n          await debugShot(page, 'role-switch-04-verified-direct');\n          info(`switchToChannel: VERIFIED requested=@${channelName} active=@${verifiedDirect} URL=${page.url()} (direct path)`);\n          return verifiedDirect;\n        }\n\n        info(`switchToChannel: direct path could not find target role @${channelName}; falling back to generic role-picker logic`);\n        await page.keyboard.press('Escape').catch(() => {});\n      } else {\n        info('switchToChannel: direct profile click did not expose Switch Role; falling back to generic trigger scan');\n      }\n    }\n  }\n'''
          if marker not in s:
              raise SystemExit('switch role marker not found')
          s=s.replace(marker, insert, 1)

          old="const h = await page.locator(sel).first().elementHandle().catch(() => null);"
          new="const h = await page.locator(sel).first().elementHandle({ timeout: 1200 }).catch(() => null);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one generic elementHandle lookup, found {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          node --check scripts/whatnot-scraper.cjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): use direct Whatnot profile role switch path'
          git push origin HEAD:Dev
