# VortexOps: compress and cache static files. Installed into /etc/nginx/conf.d/
# by scripts/baremetal-deploy.sh (http block, so it applies to the site without
# touching its server block). Pages themselves stay uncached (Laravel sets that).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

# How long a browser may keep each file. /build/ names change with every build
# (content hash) and /livewire-*/livewire.js?id= changes with every release, so
# a year is safe; Filament's /js /css /fonts carry ?v=<version>. Pages: off.
map $uri $vortexops_expires {
    default                          off;
    ~^/build/                        1y;
    ~^/livewire-[^/]+/livewire\.js   1y;
    ~^/(js|css|fonts)/filament/      7d;
    ~^/(img|images|brand|guide)/     7d;
    ~\.(woff2?|ttf|otf)$             30d;
}
expires $vortexops_expires;
