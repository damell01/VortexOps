name: one-time-bypass-analytics-preflight

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch scraper preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/whatnot-scraper.cjs')
          s = p.read_text()
          old = "await page.goto('https://www.whatnot.com/account/analytics', { waitUntil: 'domcontentloaded', timeout: 20000 });"
          new = "await page.goto('https://www.whatnot.com/dashboard/home', { waitUntil: 'domcontentloaded', timeout: 20000 });"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 analytics preflight occurrence, found {count}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check scripts/whatnot-scraper.cjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): use seller hub for auth preflight'
          git push origin Dev
