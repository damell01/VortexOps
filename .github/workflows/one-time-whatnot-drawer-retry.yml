name: One-time Whatnot drawer retry

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-drawer-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Patch scraper
        shell: bash
        run: |
          echo '' | base64 -d | python3
          node --check scripts/whatnot-scraper.cjs

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- scripts/whatnot-scraper.cjs; then
            echo 'No scraper changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): retry Whatnot role drawer once safely'
          git push origin HEAD:Dev
