name: Development UI consistency
on:
  pull_request:
    branches: [Dev]
    paths: ['resources/**', 'scripts/check-*.cjs', 'tests/Feature/Inventory/InventoryWorkspacePagesTest.php', '.github/workflows/ui-consistency.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pdo_sqlite,sqlite3,zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          node scripts/check-ui-consistency.cjs
          node scripts/check-action-feedback.cjs
          node scripts/check-ux.cjs
          node scripts/check-confirmations.cjs
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan view:cache
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
      - run: php artisan test tests/Unit/ModalCssRegressionTest.php tests/Feature/Reliability/InventoryAdminNavigationTest.php tests/Feature/Reliability/ReceivingNavigationTest.php tests/Feature/Payroll/PayrollOverviewUiTest.php tests/Feature/Inventory/InventoryWorkspacePagesTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
