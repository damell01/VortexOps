name: Apply Whatnot challenge diagnostics

on:
  push:
    branches: [Dev]
    paths:
      - '.github/scripts/apply-whatnot-challenge-diagnostics.py'
      - '.github/workflows/apply-whatnot-challenge-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .github/scripts/apply-whatnot-challenge-diagnostics.py
      - name: Syntax check scraper
        run: node --check scripts/whatnot-scraper.cjs
      - name: Commit scraper change and remove temporary patch files
        run: |
          rm -f .github/scripts/apply-whatnot-challenge-diagnostics.py
          rm -f .github/workflows/apply-whatnot-challenge-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs .github/scripts .github/workflows
          git commit -m 'chore(scraper): add read-only challenge diagnostics'
          git push origin HEAD:Dev
