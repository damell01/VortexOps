# External MySQL override
# Use when you have a managed/external MySQL instance (e.g. PlanetScale, RDS, DigitalOcean Managed DB).
#
# Set in .env.docker:
#   DB_HOST=your-db-host.example.com
#   DB_PORT=3306
#   DB_DATABASE=vortexops
#   DB_USERNAME=vortexops
#   DB_PASSWORD=your-strong-password
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml \
#       up -d app worker scheduler ai-worker redis
#
# This overlay:
#   - Marks mysql as an optional (required: false) dependency so app services start without it
#   - Disables the bundled mysql service via profiles so it never starts
#   - Sets WAIT_FOR_DB=false since the entrypoint wait-loop targets the Docker-internal "mysql" hostname

services:
  app:
    depends_on:
      mysql:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
    environment:
      WAIT_FOR_DB: "false"

  worker:
    depends_on:
      mysql:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      WAIT_FOR_DB: "false"

  scheduler:
    depends_on:
      mysql:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      WAIT_FOR_DB: "false"

  ai-worker:
    depends_on:
      mysql:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      WAIT_FOR_DB: "false"

  mysql:
    # profiles: prevents this service from starting unless explicitly requested.
    profiles: ["disabled"]
