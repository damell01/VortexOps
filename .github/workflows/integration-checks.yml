name: VortexOps integration checks
on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches:
      - Production
      - Dev
jobs:
  php-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none
      - name: PHP syntax checks
        run: |
          find app routes database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        env:
          APP_ENV: testing
          WHATNOT_SELLER_LIVE_REQUESTS_ENABLED: 'false'
          WHATNOT_SELLER_SYNC_SCHEDULER_ENABLED: 'false'
          WHATNOT_SELLER_WEBHOOK_PROCESSING_ENABLED: 'false'
        run: php artisan test
