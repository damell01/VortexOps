name: Diagnose tests (temporary)
on:
  push:
    branches: [ci/diagnose-tests]
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Full suite
        env: { APP_ENV: testing, DB_CONNECTION: sqlite, DB_DATABASE: ':memory:' }
        run: |
          set +e
          vendor/bin/phpunit --no-progress --log-junit junit.xml > full.txt 2>&1
          echo "exit=$?"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for tc in ET.parse('junit.xml').getroot().iter('testcase'):
              for k in ('failure','error'):
                  e=tc.find(k)
                  if e is not None:
                      print('=====', k, tc.get('class'), '::', tc.get('name'))
                      t=(e.text or ''); print(t[:700] + ('\n   [...]\n' + t[-900:] if len(t) > 1600 else t[700:1600]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            full.txt
            junit.xml
