name: Inventory runtime diagnostic
on:
  push:
    branches: [fix/inventory-list-500]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
      - name: Read sanitized error types and application source locations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -eu
            cd /var/www/vortexops
            git rev-parse --short HEAD
            git reflog -6 --format="REVISION %h %gs"
            test ! -f public/build/manifest.json || echo MANIFEST_PRESENT
            test -f public/build/manifest.json || echo MANIFEST_MISSING
            sudo -n nginx -T 2>/dev/null | awk '/^[[:space:]]*(server_name|root|access_log|error_log|fastcgi_pass)[[:space:]]/ {print "WEB_CONFIG " $0}' || true
            php <<'PHP' 
            <?php
            require 'vendor/autoload.php';
            $app = require 'bootstrap/app.php';
            $request = Illuminate\Http\Request::create('https://vortexops.tech/admin/inventory-items', 'GET');
            $app->instance('request', $request);
            $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
            $kernel->bootstrap();
            $owner = App\Models\User::where('email', config('app.owner_email'))->firstOrFail();
            auth()->guard('web')->setUser($owner);
            $response = $kernel->handle($request);
            echo 'INVENTORY_AUTHENTICATED_GET_STATUS '.$response->getStatusCode().PHP_EOL;
            echo 'INVENTORY_CATALOG_VISIBLE '.(str_contains($response->getContent(), 'data-vx-page=') && str_contains($response->getContent(), 'Products') ? 'yes' : 'no').PHP_EOL;
            $navigate = Illuminate\Http\Request::create('https://vortexops.tech/admin/inventory-items', 'GET', [], [], [], ['HTTP_X_LIVEWIRE_NAVIGATE' => 'true']);
            auth()->guard('web')->setUser($owner);
            $navResponse = $kernel->handle($navigate);
            echo 'INVENTORY_SPA_GET_STATUS '.$navResponse->getStatusCode().PHP_EOL;
            auth()->guard('web')->setUser($owner);
            $payRequest = Illuminate\Http\Request::create('https://vortexops.tech/admin/weekly-payout-batches/66', 'GET');
            $payResponse = $kernel->handle($payRequest);
            echo 'PAYRUN_AUTHENTICATED_GET_STATUS '.$payResponse->getStatusCode().PHP_EOL;
            echo 'PAYRUN_PERIOD_SHOWS_VISIBLE '.(str_contains($payResponse->getContent(), 'Shows in this period') ? 'yes' : 'no').PHP_EOL;
            // Do not print raw messages, SQL, request data, identities or credentials.
            foreach (array_unique(array_merge(glob('/var/log/nginx/*.log') ?: [], ['/var/log/apache2/error.log', '/var/log/apache2/access.log'])) as $serverLog) {
                if (!is_readable($serverLog)) continue;
                $handle = fopen($serverLog, 'rb');
                fseek($handle, max(0, filesize($serverLog) - 2000000));
                $serverText = stream_get_contents($handle);
                fclose($handle);
                $lines = array_values(array_filter(explode("\n", $serverText), fn ($line) => str_contains($line, 'inventory-items')));
                foreach (array_slice($lines, -30) as $line) {
                    if (preg_match('~\[([^\]]+)\].*?"(?:GET|POST) [^" ]*inventory-items[^" ]* HTTP/[^" ]+" ([0-9]{3})~', $line, $m)) echo 'WEB_INVENTORY_STATUS '.$m[1].' '.$m[2].' '.(preg_match('~inventory-items(?:\?[^ ]*)? HTTP/~', $line) ? 'list' : 'detail').PHP_EOL;
                    foreach (['Permission denied', 'Primary script unknown', 'File not found', 'Allowed memory size', 'upstream timed out', 'PHP Fatal error', 'Connection refused', 'Unable to open', 'failed to open stream', 'No such file'] as $word) {
                        if (stripos($line, $word) !== false) echo 'WEB_ERROR_KIND '.$word.PHP_EOL;
                    }
                    preg_match_all('~(?:/var/www/vortexops/)([A-Za-z0-9_./-]+\.php)(?::([0-9]+))?~', $line, $paths, PREG_SET_ORDER);
                    foreach ($paths as $m) echo 'WEB_ERROR_SOURCE '.$m[1].':'.($m[2] ?? '').PHP_EOL;
                }
            }
            echo 'LIVE_PHP_VERSION '.PHP_VERSION.PHP_EOL;
            echo 'LIVE_LOG_CHANNEL '.config('logging.default').PHP_EOL;
            $files = glob('storage/logs/*.log') ?: [];
            usort($files, fn ($a, $b) => filemtime($b) <=> filemtime($a));
            foreach (array_slice($files, 0, 8) as $file) {
                echo 'LOG_FILE '.basename($file).PHP_EOL;
                $handle = fopen($file, 'rb');
                fseek($handle, max(0, filesize($file) - 1000000));
                $text = stream_get_contents($handle);
                fclose($handle);
                $blocks = preg_split('/(?=^\[\d{4}-\d{2}-\d{2} )/m', $text);
                $errors = array_values(array_filter($blocks, fn ($b) => str_contains(substr($b, 0, 180), '.ERROR:')));
                foreach (array_slice($errors, -20) as $block) {
                    $block = str_replace('\\/', '/', $block);
                    preg_match('/^\[([0-9: -]+)\]/', $block, $time);
                    echo 'ERROR_TIME '.($time[1] ?? 'unknown').PHP_EOL;
                    foreach (['Access denied', 'Permission denied', 'Undefined', 'not found', 'SQLSTATE', 'Call to', 'does not exist', 'Too many', 'Allowed memory', 'syntax error', 'must be of type', 'manifest', 'failed to open', 'CSRF', 'integrity constraint', 'Authentication', 'Unresolvable', 'Target class'] as $kind) {
                        if (stripos(substr($block, 0, 1500), $kind) !== false) echo 'ERROR_CATEGORY '.$kind.PHP_EOL;
                    }
                    $headline = substr(explode('\n', $block)[0], 0, 1200);
                    foreach (['memory', 'exhausted', 'permission', 'denied', 'manifest', 'Vite', 'Component', 'View', 'SQLSTATE', 'column', 'stock_sum_quantity', 'products', 'method', 'property', 'undefined', 'function', 'not found', 'table', 'syntax', 'Alpine', 'Livewire', 'route', 'session', 'Redis', 'Connection', 'refused', 'timeout', 'Too many', 'TypeError', 'array', 'string', 'null', 'cache', 'file', 'failed', 'open', 'duplicate', 'decrypt', 'key', 'readonly', 'disabled'] as $word) {
                        if (stripos($headline, $word) !== false) echo 'HEADLINE_TOKEN '.$word.PHP_EOL;
                    }
                    foreach ([
                        '/View \[([A-Za-z0-9_.-]+)\] not found/' => 'MISSING_VIEW',
                        '/SQLSTATE\[([A-Z0-9]+)\]/' => 'SQLSTATE',
                        '/\[object\] \(([A-Za-z0-9_\\\\]+)/' => 'EXCEPTION_CLASS',
                        '/Duplicate column name [\x27\x22]([A-Za-z0-9_.]+)[\x27\x22]/' => 'DUPLICATE_COLUMN',
                        '/Undefined array key [\x27\x22]([A-Za-z0-9_.]+)[\x27\x22]/' => 'MISSING_ARRAY_KEY',
                        '/Unable to locate file in Vite manifest: ([A-Za-z0-9_./-]+)/' => 'MISSING_VITE_ASSET',
                        '/Vite manifest not found at: ([A-Za-z0-9_./-]+)/' => 'MISSING_MANIFEST',
                        '/Allowed memory size of ([0-9]+)/' => 'MEMORY_LIMIT',
                        '/Maximum execution time of ([0-9]+)/' => 'TIME_LIMIT',
                        '/Unknown column [\x27\x22]([A-Za-z0-9_.]+)[\x27\x22]/' => 'MISSING_COLUMN',
                        '/Call to undefined method ([A-Za-z0-9_\\\\]+::[A-Za-z0-9_]+)\(/' => 'MISSING_METHOD',
                        '/Undefined variable \$([A-Za-z0-9_]+)/' => 'MISSING_VARIABLE',
                        '/Class [\x27\x22]([A-Za-z0-9_\\\\]+)[\x27\x22] not found/' => 'MISSING_CLASS',
                    ] as $pattern => $label) {
                        if (preg_match($pattern, $block, $match)) echo $label.' '.$match[1].PHP_EOL;
                    }
                    preg_match_all('~(?:/var/www/vortexops/)((?:app|resources/views)/[A-Za-z0-9_./-]+\.php)(?:\((\d+)\)|:(\d+))?~', $block, $frames, PREG_SET_ORDER);
                    preg_match_all('~resources/[A-Za-z0-9_./-]+~', $block, $assets);
                    foreach (array_unique($assets[0]) as $asset) echo 'ASSET_REFERENCE '.$asset.PHP_EOL;
                    $printed = [];
                    foreach ($frames as $frame) {
                        $source = $frame[1].':'.($frame[2] ?? $frame[3] ?? '');
                        if (isset($printed[$source])) continue;
                        $printed[$source] = true;
                        echo 'SOURCE '.$source.PHP_EOL;
                        if (count($printed) >= 5) break;
                    }
                }
            }
            PHP
