name: Reliability checks
on:
  push:
    branches: [Production, Dev, reliability-pass]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: node scripts/check-ux.cjs
      - run: node scripts/check-confirmations.cjs
      - run: node scripts/check-action-feedback.cjs
      - run: python3 scripts/check-show-scan-range.py
      - run: python3 -m py_compile scripts/whatnot-analytics-lives.py
      - run: npm run build
      - name: PHP lint and compile templates
        run: |
          find app bootstrap tests/Feature/Reliability -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache
      - name: Regression tests
        run: php artisan test tests/Feature/Reliability tests/Feature/Reports/ReportPagesRenderTest.php tests/Feature/Payouts/PayRunLifecycleHardeningTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
