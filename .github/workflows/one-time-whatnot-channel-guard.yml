name: One-time Whatnot channel guard fix

on:
  push:
    branches: [Dev]
    paths:
      - .github/workflows/one-time-whatnot-channel-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Apply exact scraper patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch_whatnot.py
          python3 /tmp/patch_whatnot.py
      - name: Syntax check
        run: node --check scripts/whatnot-scraper.cjs
      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-time-whatnot-channel-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/whatnot-scraper.cjs .github/workflows/one-time-whatnot-channel-guard.yml
          git commit -m "fix(scraper): verify Whatnot channel before scraping"
          git push origin HEAD:Dev
