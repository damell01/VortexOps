name: Custom Pay Run Checks

on:
  pull_request:
    branches: [Production, Dev]
    paths:
      - 'app/**'
      - 'database/migrations/**'
      - 'resources/views/**'
      - 'tests/**'
      - '.github/workflows/custom-payrun-checks.yml'

jobs:
  payroll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Pay run types and dates
        run: php artisan test tests/Feature/Payouts/PayRunSchedulesTest.php
      - name: Wages and business isolation
        if: '!cancelled()'
        run: php artisan test tests/Feature/Businesses/BusinessPayrollTest.php tests/Feature/Payroll/PayrollTeamSetupTest.php
      - name: Hours and upcoming show picker
        if: '!cancelled()'
        run: php artisan test tests/Feature/Timekeeping/HoursWorkedTest.php tests/Feature/Timekeeping/TimekeepingTest.php
      - name: Pay run lifecycle
        if: '!cancelled()'
        run: php artisan test tests/Feature/Payouts
