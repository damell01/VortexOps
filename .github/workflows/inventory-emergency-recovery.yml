name: Inventory verified runtime recovery
on:
  push:
    branches: [fix/inventory-list-500]
    paths: ['.github/workflows/inventory-emergency-recovery.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d6d5a5e5d49bb9f544be21dba8f0c9bcb923571
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -l app/Providers/Filament/AdminPanelProvider.php
      - run: cp .env.example .env
      - run: php artisan test tests/Feature/Payroll/PayRunPeriodShowsTest.php tests/Feature/Payroll/PayRunRoleSectionsTest.php tests/Feature/Inventory/InventoryItemDeleteTest.php tests/Feature/Inventory/DeletedItemStockTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-modal-opening.cjs
      - run: npm run build
  recover:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Apply verified merged inventory fix and restore compiled assets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set -eu
            cd /var/www/vortexops
            OLD_SHA=$(git rev-parse HEAD)
            TARGET=5d6d5a5e5d49bb9f544be21dba8f0c9bcb923571
            case "$OLD_SHA" in
              428c775ae42e47884a1346dabdd3ba4428210ad6|5d6d5a5e5d49bb9f544be21dba8f0c9bcb923571) ;;
              *) echo 'Application revision changed; refusing stale recovery'; exit 1 ;;
            esac
            git diff --quiet
            git diff --cached --quiet
            git fetch origin Production
            git cat-file -e "$TARGET^{commit}"
            BACKUP=$(mktemp -d /tmp/vortex-inventory-assets.XXXXXX)
            if [ -d public/build ]; then cp -a public/build "$BACKUP/build"; fi
            rollback() {
              git checkout -B Production "$OLD_SHA"
              if [ -d "$BACKUP/build" ]; then rm -rf public/build; cp -a "$BACKUP/build" public/build; fi
              php artisan view:clear >/dev/null 2>&1 || true
            }
            trap rollback EXIT
            git checkout -B Production "$TARGET"
            npm ci --no-audit --no-fund
            npm run build
            php <<'PHP'
            <?php
            $manifest = json_decode(file_get_contents('public/build/manifest.json'), true, 512, JSON_THROW_ON_ERROR);
            foreach (['resources/css/filament/admin/theme.css', 'resources/js/app.js', 'resources/js/barcode-scanner.js', 'resources/js/colosseum.js'] as $entry) {
                if (!isset($manifest[$entry]['file']) || !is_file('public/build/'.$manifest[$entry]['file'])) throw new RuntimeException('Required inventory asset missing');
            }
            echo "INVENTORY_ASSETS_VERIFIED\n";
            PHP
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan filament:optimize
            FPM_UNITS=$(systemctl list-units --type=service --all --no-legend 'php*-fpm.service' 2>/dev/null | awk '{print $1}')
            for FPM_UNIT in $FPM_UNITS; do sudo -n systemctl reload "$FPM_UNIT"; done
            php artisan health:check >/dev/null
            trap - EXIT
            echo "INVENTORY_RECOVERY_COMPLETE $(git rev-parse --short HEAD)"

  verify-serving:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 60s
        command_timeout: 90s
        script: "set -eu\ncd /var/www/vortexops\nCHECK_FILE=$(mktemp /var/www/vortexops/storage/framework/inventory-fpm-check.XXXXXX.php)\n\
          trap 'rm -f \"$CHECK_FILE\"' EXIT\ncat > \"$CHECK_FILE\" <<'PHP'\n<?php\n\
          try {\n    require '/var/www/vortexops/vendor/autoload.php';\n    $app = require\
          \ '/var/www/vortexops/bootstrap/app.php';\n    $request = Illuminate\\Http\\\
          Request::create('https://vortexops.tech/admin/inventory-items', 'GET');\n\
          \    $app->instance('request', $request);\n    $kernel = $app->make(Illuminate\\\
          Contracts\\Http\\Kernel::class);\n    $kernel->bootstrap();\n    $app->instance(Illuminate\\\
          Contracts\\Debug\\ExceptionHandler::class, new class($app) extends Illuminate\\\
          Foundation\\Exceptions\\Handler {\n        public function report(Throwable\
          \ $e): void\n        {\n            do {\n                echo 'CHECK_ERROR_CLASS\
          \ '.get_class($e).\"\\n\";\n                echo 'CHECK_ERROR_SOURCE '.str_replace('/var/www/vortexops/',\
          \ '', $e->getFile()).':'.$e->getLine().\"\\n\";\n                foreach (['Permission\
          \ denied', 'failed to open stream', 'file_put_contents', 'memory', 'SQLSTATE',\
          \ 'Unknown column', 'stock_sum_quantity', 'manifest', 'Undefined', 'must be\
          \ of type', 'not found', 'Session', 'Redis', 'Connection refused', 'Cannot',\
          \ 'syntax', 'Call to', 'readonly', 'decrypt', 'No such file', 'Maximum execution']\
          \ as $word) {\n                    if (stripos($e->getMessage(), $word) !==\
          \ false) echo 'CHECK_ERROR_KIND '.$word.\"\\n\";\n                }\n    \
          \            foreach (['/Unknown column [\\x27\\x22]([A-Za-z0-9_.]+)[\\x27\\\
          x22]/', '/Undefined variable \\$([A-Za-z0-9_]+)/', '/Call to undefined method\
          \ ([A-Za-z0-9_\\\\\\\\]+::[A-Za-z0-9_]+)\\(/'] as $pattern) {\n          \
          \          if (preg_match($pattern, $e->getMessage(), $m)) echo 'CHECK_ERROR_IDENTIFIER\
          \ '.$m[1].\"\\n\";\n                }\n            } while ($e = $e->getPrevious());\n\
          \        }\n    });\n    $owner = App\\Models\\User::where('email', config('app.owner_email'))->firstOrFail();\n\
          \    auth()->guard('web')->setUser($owner);\n    $response = $kernel->handle($request);\n\
          \    echo 'CHECK_FPM_VERSION '.PHP_VERSION.\"\\n\";\n    echo 'CHECK_INVENTORY_STATUS\
          \ '.$response->getStatusCode().\"\\n\";\n    echo 'CHECK_NAVBAR_SEARCH_REMOVED\
          \ '.(!str_contains($response->getContent(), 'wire:key=\"global-search.field.input\"\
          ') ? 'yes' : 'no').\"\\n\";\n    echo 'CHECK_CATALOG_VISIBLE '.(str_contains($response->getContent(),\
          \ 'vx-inventory-list') && str_contains($response->getContent(), 'Products')\
          \ ? 'yes' : 'no').\"\\n\";\n    auth()->guard('web')->setUser($owner);\n \
          \   $payRequest = Illuminate\\Http\\Request::create('https://vortexops.tech/admin/weekly-payout-batches/66',\
          \ 'GET');\n    $payResponse = $kernel->handle($payRequest);\n    echo 'CHECK_PAYRUN_STATUS\
          \ '.$payResponse->getStatusCode().\"\\n\";\n    echo 'CHECK_PERIOD_SHOWS_VISIBLE\
          \ '.(str_contains($payResponse->getContent(), 'Shows in this period') ? 'yes'\
          \ : 'no').\"\\n\";\n} catch (Throwable $e) {\n    echo 'CHECK_EXCEPTION_CLASS\
          \ '.get_class($e).\"\\n\";\n}\nPHP\nchmod 644 \"$CHECK_FILE\"\npython3 - \"\
          $CHECK_FILE\" <<'PY'\nimport socket, struct, sys\ndef record(kind, data):\n\
          \    return struct.pack('!BBHHBB', 1, kind, 1, len(data), 0, 0) + data\ndef\
          \ encoded(value):\n    value = value.encode()\n    n = len(value)\n    return\
          \ (bytes([n]) if n < 128 else struct.pack('!I', n | 0x80000000)) + value\n\
          params = {'SCRIPT_FILENAME':sys.argv[1], 'SCRIPT_NAME':'/inventory-internal-verification.php',\
          \ 'REQUEST_METHOD':'GET', 'REQUEST_URI':'/admin/inventory-items', 'SERVER_NAME':'vortexops.tech',\
          \ 'HTTP_HOST':'vortexops.tech', 'SERVER_PORT':'443', 'HTTPS':'on', 'SERVER_PROTOCOL':'HTTP/1.1',\
          \ 'GATEWAY_INTERFACE':'CGI/1.1', 'REMOTE_ADDR':'127.0.0.1', 'CONTENT_LENGTH':'0'}\n\
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)\ns.settimeout(70)\n\
          s.connect('/run/php/php8.4-fpm.sock')\ndef pair(k,v):\n    key,value=k.encode(),v.encode()\n\
          \    def size(n): return bytes([n]) if n < 128 else struct.pack('!I', n |\
          \ 0x80000000)\n    return size(len(key))+size(len(value))+key+value\npayload\
          \ = b''.join(pair(k,v) for k,v in params.items())\ns.sendall(record(1, struct.pack('!HB5x',1,0))\
          \ + record(4,payload) + record(4,b'') + record(5,b''))\ndef exact(n):\n  \
          \  out=b''\n    while len(out)<n:\n        part=s.recv(n-len(out))\n     \
          \   if not part: raise RuntimeError('Incomplete FastCGI response')\n     \
          \   out+=part\n    return out\nstdout=b''\nwhile True:\n    version,kind,req,size,pad,_=struct.unpack('!BBHHBB',exact(8))\n\
          \    data=exact(size)\n    if pad: exact(pad)\n    if kind==6: stdout+=data\n\
          \    if kind==3: break\ns.close()\nlines=[line for line in stdout.decode(errors='replace').splitlines()\
          \ if line.startswith('CHECK_')]\nfor line in lines: print(line)\nif any(expected\
          \ not in lines for expected in ['CHECK_INVENTORY_STATUS 200', 'CHECK_CATALOG_VISIBLE\
          \ yes', 'CHECK_NAVBAR_SEARCH_REMOVED yes', 'CHECK_PAYRUN_STATUS 200', 'CHECK_PERIOD_SHOWS_VISIBLE\
          \ yes']):\n    raise SystemExit('Serving PHP inventory verification failed')\n\
          PY\n"
    needs: recover
