name: Deploy

on:
  push:
    branches: [Dev, Production]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} bare-metal
    if: github.ref_name == 'Dev' || github.ref_name == 'Production'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'Production' && 'production' || 'development' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            BRANCH='${{ github.ref_name }}'
            if [ "$BRANCH" = 'Production' ]; then
              APP_DIR='/var/www/vortexops'
            else
              APP_DIR='/var/www/vortexops-dev'
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ "$BRANCH" = 'Dev' ]; then
                echo "Dev checkout not created yet at $APP_DIR; skipping automatic Dev deploy."
                echo "Run deploy/setup-dev-baremetal.sh once after the dev subdomain points here."
                exit 0
              fi

              echo "Production checkout is missing at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            export DEPLOY_BRANCH="$BRANCH"
            export DEPLOY_ENVIRONMENT="$([ "$BRANCH" = 'Production' ] && echo production || echo development)"

            # Back up the currently-running database before replacing tracked code.
            php artisan db:backup --prune=30
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            bash scripts/baremetal-deploy.sh "$BRANCH"
