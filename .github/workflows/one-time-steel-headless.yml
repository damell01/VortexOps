name: one-time-steel-headless

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-steel-headless.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Restore Steel headless mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/whatnot-scraper.cjs')
          s = p.read_text()
          old = "    headless: false,\n"
          new = "    headless: true,\n"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Steel headless:false, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

          node --check scripts/whatnot-scraper.cjs

      - name: Commit patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-steel-headless.yml
          git add -A
          git commit -m 'fix(scraper): run Steel headless in Docker'
          git push origin Dev
