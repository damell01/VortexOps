name: DBellOps isolated browser recording
on:
  push:
    branches: [feature/dbellops-demo]
    paths:
      - '.github/workflows/dbellops-record.yml'
      - 'demo/**'
      - 'resources/views/filament/components/dashboard-reference.blade.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: DBellOps
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8088
      DBELLOPS_DEMO: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      DEMO_RECORD_EMAIL: seller.demo@example.test
      DEMO_RECORD_PASSWORD: TemporaryLocalRecordingOnly123
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd, intl, zip, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
      - name: Seed isolated fictional demo account
        run: php demo/create-recording-user.php
      - name: Start real Laravel app
        run: |
          php artisan serve --host=127.0.0.1 --port=8088 > /tmp/dbellops-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8088/admin/login >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/dbellops-server.log
          exit 1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Record authentic browser pages
        run: node demo/record-vortexops.mjs
      - name: Create video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -y -framerate 1/3 -pattern_type glob -i 'demo/output/*.png' -vf "fps=24,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p" -c:v libx264 -pix_fmt yuv420p demo/output/DBellOps_VortexOps_Source_Recording.mp4
      - name: Upload video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbellops-vortexops-source-recording
          path: |
            demo/output/*.mp4
            demo/output/*.png
            /tmp/dbellops-server.log
          if-no-files-found: warn
