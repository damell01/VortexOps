# VortexOps — Nginx reverse-proxy config
# Replace YOUR_DOMAIN with your actual domain before using.
# Place in /etc/nginx/sites-available/vortexops and symlink to sites-enabled.
#
# Run vps-setup.sh to do this automatically, or manually:
#   sed 's/YOUR_DOMAIN/ops.vortexbreaks.com/g' deploy/nginx.conf \
#       | sudo tee /etc/nginx/sites-available/vortexops
#   sudo ln -s /etc/nginx/sites-available/vortexops /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d YOUR_DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Managed by Certbot — paths created after running certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"          always;

    # Allow larger uploads (barcode images, imports)
    client_max_body_size 64M;

    # Access log — disable health-check noise
    access_log /var/log/nginx/vortexops_access.log combined;
    error_log  /var/log/nginx/vortexops_error.log  warn;

    location = /health {
        access_log off;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;

        # WebSocket support (Livewire/Reverb)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Buffer tuning — prevents slow-client timeouts on large exports
        proxy_buffering    on;
        proxy_buffers      16 16k;
        proxy_buffer_size  32k;
    }
}
