name: One-time backfill Seller Hub fix

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-backfill-seller-hub-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 .github/scripts/patch-backfill-seller-hub.py
          node --check scripts/whatnot-production-sync.cjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-production-sync.cjs
          git commit -m 'fix(backfill): use working Seller Hub entry path'
          git push origin HEAD:Dev
