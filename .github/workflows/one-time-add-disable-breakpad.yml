name: One-time patch Whatnot preflight route

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/one-time-add-disable-breakpad.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Patch authenticated preflight route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/whatnot-scraper.cjs')
          text = path.read_text()

          old = """      await page.goto(URLS.home, { waitUntil: 'domcontentloaded', timeout: 20000 });\n      await page.waitForLoadState('networkidle', { timeout: 6000 }).catch(() => {});\n\n      // Not just \"did goto resolve\" — see confirmSellerHub. The answer this\n"""
          new = """      // Use the account analytics shell for the authenticated preflight.\n      // Both /dashboard/home and / are currently Cloudflare-challenged on this\n      // server even with a valid imported session, while /account/analytics is\n      // the already-established route used by the working historical analytics\n      // scraper and is outside the challenged /dashboard surface.\n      await page.goto('https://www.whatnot.com/account/analytics', { waitUntil: 'domcontentloaded', timeout: 20000 });\n      await page.waitForLoadState('networkidle', { timeout: 6000 }).catch(() => {});\n\n      // Not just \"did goto resolve\" — see confirmSellerHub. The answer this\n"""

          if old not in text:
              raise SystemExit('Expected homepage auth preflight block not found; refusing unrelated edit')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate scraper syntax
        run: node --check scripts/whatnot-scraper.cjs

      - name: Commit fix to Dev
        run: |
          if git diff --quiet -- scripts/whatnot-scraper.cjs; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/whatnot-scraper.cjs
          git commit -m "fix(scraper): use account analytics for auth preflight"
          git push origin Dev
