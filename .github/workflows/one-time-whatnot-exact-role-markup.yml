name: One-time Whatnot exact role markup

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-exact-role-markup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Patch exact role switch markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/whatnot-scraper.cjs')
          s=p.read_text()

          s=s.replace("const SWITCH_ROLE_SEL = 'div.eCoev h4.ogVNN';", "const SWITCH_ROLE_SEL = '#team-invite-switch-role-anchor, div.eCoev h4.ogVNN';", 1)
          s=s.replace("    'img[alt=\"avatar\"]',", "    'img.z-avatar-image[alt][width=\"40\"][height=\"40\"]',\n    'img[alt=\"avatar\"]',", 1)

          old = r'''  // Confirmed July 2026 (real markup): the account switcher is a plain HTML form
  // (POST /api/v1/auth/switch-role), one <button formaction="/api/v1/auth/switch-role"
  // name="id" value="<globalId>"> per account, with the username shown lowercase and
  // unspaced (e.g. "vortexbreaks", not "Vortex Breaks"). Match on that directly instead
  // of guessing spaced/camelCase variants — case-insensitive since getByText is
  // case-sensitive by default and the UI casing may not match whatever the DB has.
  const SWITCH_ROLE_BUTTON_SEL = 'button[formaction="/api/v1/auth/switch-role"]';
  const targetKey = channelName.replace(/[^a-z0-9]/gi, '').toLowerCase();

  let target = null;
  const roleButtons = await page.$$(SWITCH_ROLE_BUTTON_SEL).catch(() => []);
  for (const btn of roleButtons) {
    const btnText = await btn.innerText().catch(() => '');
    if (btnText.replace(/[^a-z0-9]/gi, '').toLowerCase().includes(targetKey)) {
      info(`switchToChannel: found channel option matching "${channelName}" (button text: ${btnText.replace(/\s+/g, ' ').trim()})`);
      target = btn;
      break;
    }
  }
'''
          new = r'''  // Current Whatnot role picker (Aug 2026) renders plain buttons containing
  // img.z-avatar-image[alt="username"] and a <strong>username</strong>. Prefer the
  // exact avatar alt supplied by Whatnot; it is a stable account identifier and
  // avoids depending on transient CSS classes or old form-action markup.
  const SWITCH_ROLE_BUTTON_SEL = 'button[formaction="/api/v1/auth/switch-role"]';
  const targetKey = channelName.replace(/[^a-z0-9]/gi, '').toLowerCase();

  let target = null;
  const exactAvatar = page.locator(`button:has(img.z-avatar-image[alt="${channelName.toLowerCase()}"])`).first();
  if (await exactAvatar.isVisible().catch(() => false)) {
    info(`switchToChannel: found exact role button by avatar alt="${channelName.toLowerCase()}"`);
    target = exactAvatar;
  }

  if (!target) {
    const roleButtons = await page.$$(SWITCH_ROLE_BUTTON_SEL).catch(() => []);
    for (const btn of roleButtons) {
      const btnText = await btn.innerText().catch(() => '');
      if (btnText.replace(/[^a-z0-9]/gi, '').toLowerCase().includes(targetKey)) {
        info(`switchToChannel: found channel option matching "${channelName}" (button text: ${btnText.replace(/\s+/g, ' ').trim()})`);
        target = btn;
        break;
      }
    }
  }
'''
          if old not in s:
              raise SystemExit('target role block not found')
          s=s.replace(old,new,1)

          old2 = r'''async function getActiveChannelUsername(page) {
  // Prefer identity links in seller navigation, but do not require the visible
'''
          new2 = r'''async function getActiveChannelUsername(page) {
  // Current Whatnot seller UI exposes the active account directly on the visible
  // 40px profile avatar via img.z-avatar-image[alt="username"]. If the role picker
  // is open, use the button carrying aria-label="Current account" to disambiguate.
  const currentRole = page.locator('button:has(svg[aria-label="Current account"]) img.z-avatar-image[alt]').first();
  const currentRoleAlt = await currentRole.getAttribute('alt', { timeout: 1000 }).catch(() => null);
  if (currentRoleAlt) return currentRoleAlt;

  const visibleAvatars = page.locator('img.z-avatar-image[alt][width="40"][height="40"]:visible');
  const visibleAvatarCount = Math.min(await visibleAvatars.count().catch(() => 0), 10);
  if (visibleAvatarCount === 1) {
    const alt = await visibleAvatars.first().getAttribute('alt', { timeout: 1000 }).catch(() => null);
    if (alt) return alt;
  }

  // Prefer identity links in seller navigation, but do not require the visible
'''
          if old2 not in s:
              raise SystemExit('active channel function start not found')
          s=s.replace(old2,new2,1)

          p.write_text(s)
          PY
          node --check scripts/whatnot-scraper.cjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): use current Whatnot role picker markup'
          git push origin HEAD:Dev
