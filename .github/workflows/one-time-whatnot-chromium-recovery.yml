name: One-time Chromium startup recovery

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-chromium-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Patch Chromium startup recovery
        run: |
          python3 .github/scripts/patch-whatnot-chromium-recovery.py
          node --check scripts/whatnot-scraper.cjs

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): recover from Chromium startup crashes'
          git push origin HEAD:Dev
