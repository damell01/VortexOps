name: One-time fix live Whatnot session scope

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/one-time-fix-live-session-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Fix live-session scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/whatnot-scraper.cjs')
          text = path.read_text()

          old_outer = """  const _cookiesFile = resolveCookiesFile();\n  const _cookiesLoadedMarker = _cookiesFile + '.loaded-mtime';\n  if (_fs.existsSync(_cookiesFile)) {\n"""
          new_outer = """  const _cookiesFile = resolveCookiesFile();\n  const _cookiesLoadedMarker = _cookiesFile + '.loaded-mtime';\n  // This distinction is also needed after the bootstrap block when deciding\n  // whether an existing cf_clearance belongs to this server or came from a\n  // human import, so keep it in the outer scope.\n  const _isServerLiveSnapshot = _cookiesFile.endsWith('whatnot-live-cookies.json');\n  if (_fs.existsSync(_cookiesFile)) {\n"""
          if old_outer not in text:
              raise SystemExit('Expected outer cookie block not found; refusing to patch')
          text = text.replace(old_outer, new_outer, 1)

          old_inner = """    const _isServerLiveSnapshot = _cookiesFile.endsWith('whatnot-live-cookies.json');\n    const _isHumanImport = Boolean(process.env.WHATNOT_COOKIES_FILE)\n"""
          new_inner = """    const _isHumanImport = Boolean(process.env.WHATNOT_COOKIES_FILE)\n"""
          if old_inner not in text:
              raise SystemExit('Expected inner live-snapshot declaration not found; refusing to patch')
          text = text.replace(old_inner, new_inner, 1)

          path.write_text(text)
          PY

          node --check scripts/whatnot-scraper.cjs

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- scripts/whatnot-scraper.cjs; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/whatnot-scraper.cjs
          git commit -m "fix(scraper): keep live session flag in scope"
          git push origin Dev
