name: Stream Review checks
on:
  push:
    branches: [Production, Dev, stream-review-production, stream-review-dev]
jobs:
  stream-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo_sqlite,sqlite3,zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: Compile pages
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache
          php -l app/Filament/Resources/ShowResource/Pages/ReviewShowStreamers.php
          php -l app/Services/ShowStreamerSuggester.php
      - name: Stream and channel review regression tests
        run: php artisan test tests/Feature/Reliability/StreamReviewTest.php tests/Feature/Reliability/ChannelReviewTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
