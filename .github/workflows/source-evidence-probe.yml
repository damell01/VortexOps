name: Isolated order source verification
'on':
  push:
    branches:
    - audit/order-source-evidence
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 60s
        command_timeout: 480s
        script: "set -eu\ncd /var/www/vortexops\ngit fetch origin fix/order-source-filter\n\
          PROBE_CODE=$(mktemp -d /tmp/vortex-order-source.XXXXXX)\ngit archive FETCH_HEAD\
          \ scripts tests/Python | tar -x -C \"$PROBE_CODE\"\n(cd \"$PROBE_CODE\"\
          \ && python3 -m unittest discover -s tests/Python -p 'test_order*.py')\n\
          export ORDER_PROBE_CODE=\"$PROBE_CODE\"\nAUDIT_FILE=$(mktemp /var/www/vortexops/storage/framework/order-probe.XXXXXX.php)\n\
          trap 'rm -f \"$AUDIT_FILE\"; rm -rf \"$PROBE_CODE\"' EXIT\ncat > \"$AUDIT_FILE\"\
          \ <<'PHP'\n<?php\ntry {\n    require '/var/www/vortexops/vendor/autoload.php';\n\
          \    $app = require '/var/www/vortexops/bootstrap/app.php';\n    $app->make(Illuminate\\\
          Contracts\\Console\\Kernel::class)->bootstrap();\n    config(['vortex.whatnot.browser_lock_fail_fast'\
          \ => false, 'vortex.whatnot.browser_lock_wait' => 120, 'vortex.whatnot.runtime_deadline'\
          \ => microtime(true) + 300]);\n    putenv('WHATNOT_BROWSER_LOCK_WAIT=120');\n\
          \    $code = getenv('ORDER_PROBE_CODE');\n    putenv('WHATNOT_USER_DATA_DIR=/var/www/vortexops/storage/whatnot-scrapling-profile');\n\
          \    putenv('WHATNOT_BROWSER_LOCK_FILE=/var/www/vortexops/storage/whatnot-browser.lock');\n\
          \    putenv('WHATNOT_PYTHON_BIN=/var/www/vortexops/.venv/bin/python');\n\
          \    putenv('WHATNOT_SCRAPLING_DIAGNOSTICS_DIR='.$code.'/diagnostics');\n\
          \    $scraper = $app->make(App\\Services\\WhatnotScraper::class);\n    (new\
          \ ReflectionProperty($scraper, 'scriptPath'))->setValue($scraper, $code.'/scripts/whatnot-runner.cjs');\n\
          \    $app->instance(App\\Services\\WhatnotScraper::class, $scraper);\n \
          \   $out = new Symfony\\Component\\Console\\Output\\BufferedOutput();\n\
          \    $exit = Illuminate\\Support\\Facades\\Artisan::call('whatnot:probe-order-filter',\
          \ [], $out);\n    $content = $out->fetch();\n    foreach (explode(\"\\n\"\
          ,$content) as $line) {\n        if (preg_match('/ORDER_SOURCE_EVIDENCE (\\\
          [.*\\])/', $line, $m)) {\n            $metadata = json_decode($m[1], true);\n\
          \            if (is_array($metadata)) echo 'ORDER_FILTER_EVIDENCE '.json_encode($metadata).\"\
          \\n\";\n        }\n    }\n    echo 'ORDER_PROBE_EXIT '.$exit.\"\\n\";\n\
          \    foreach (['ORDER_SOURCE_FILTER_COLLISION', 'CLOUDFLARE_CHALLENGE',\
          \ 'LOGIN_REQUIRED', 'BROWSER_LOCK_TIMEOUT', 'SOURCE FILTER FAILED', 'SOURCE_FILTER_UNTRUSTED',\
          \ 'AUTH_REQUIRED', 'CHANNEL_CONTEXT_MISMATCH', 'CHANNEL_SWITCH_FAILED',\
          \ 'CHANNEL_SWITCH_', 'Cloudflare', 'CHALLENGE', 'SELECTOR_MISS', 'Timed\
          \ out', 'timed out', 'timeout', 'window ended', 'already active', 'INCONCLUSIVE',\
          \ 'Could not auto-select', 'No orders were imported'] as $flag) {\n    \
          \    if (stripos($content, $flag) !== false) echo 'ORDER_PROBE_SIGNAL '.$flag.\"\
          \\n\";\n    }\n    if (preg_match('/\\{\\s*\"show_order_counts\"\\s*:.*?\\\
          }\\s*(?:,\\s*\"overlapping_order_ids\"\\s*:\\s*\\d+\\s*\\})?/s', $content,\
          \ $m)) {\n        $data = json_decode($m[0], true);\n        if ($data)\
          \ echo 'ORDER_PROBE_COUNTS '.json_encode(['counts' => array_values($data['show_order_counts']),\
          \ 'overlap' => $data['overlapping_order_ids'] ?? null]).\"\\n\";\n    }\n\
          \    echo \"ORDER_PROBE_IMPORTS_PERFORMED 0\\n\";\n} catch (Throwable $e)\
          \ {\n    echo 'ORDER_PROBE_ERROR_CLASS '.get_class($e).\"\\n\";\n    foreach\
          \ (['AUTH_REQUIRED','CHANNEL_SWITCH','Cloudflare','timeout','already active']\
          \ as $flag) if (stripos($e->getMessage(),$flag)!==false) echo 'ORDER_PROBE_SIGNAL\
          \ '.$flag.\"\\n\";\n    exit(1);\n}\n\nPHP\nphp \"$AUDIT_FILE\"\n"
