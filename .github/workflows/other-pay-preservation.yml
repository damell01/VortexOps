name: Other Pay preservation checks
on:
  push:
    branches: [fix/preserve-other-pay]
permissions:
  contents: read
jobs:
  payroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan test tests/Feature/Payroll tests/Feature/Payouts tests/Feature/Timekeeping
      - run: php artisan view:cache
