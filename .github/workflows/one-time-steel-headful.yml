name: one-time-steel-headful

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-steel-headful.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
      - name: Enable headful Steel sessions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/whatnot-scraper.cjs')
          s = p.read_text()
          old = '    headless: true,\n'
          new = "    // Match the headed browser mode that has historically worked best for Whatnot.\n    // Steel owns the display/browser process inside its container.\n    headless: false,\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one Steel headless setting, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/whatnot-scraper.cjs
      - name: Commit patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-steel-headful.yml
          git add -A
          git commit -m 'fix(scraper): run Steel browser headful'
          git push origin Dev
