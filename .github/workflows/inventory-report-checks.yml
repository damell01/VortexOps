name: Inventory Report Checks
on:
  push:
    branches: ['codex/mobile-resource-cards-*', 'codex/shared-mobile-controls-*']
  pull_request:
    branches: [Production, Dev]
    paths:
      - 'app/Filament/**'
      - 'app/Providers/Filament/**'
      - 'resources/**'
      - 'tests/Feature/Inventory/**'
      - 'tests/Feature/Reports/**'
      - 'tests/Browser/mobile-reports.spec.ts'
      - 'playwright.mobile-reports.config.ts'
      - '.github/workflows/inventory-report-checks.yml'
jobs:
  report:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vortexops_test
          MYSQL_USER: vortexops
          MYSQL_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vortexops_test
      DB_USERNAME: vortexops
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_mysql,zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Inventory reporting integration tests
        run: php artisan test tests/Feature/Inventory/InventoryReportOperationsTest.php
      - name: Existing inventory report render test
        run: php artisan test tests/Feature/Inventory/EveryInventoryPageRendersTest.php --filter='test_the_page_opens.*(InventoryReport|InventoryAge|InventoryAnalytics|InventoryValueDashboard|InventoryVelocityAnalytics|ListInventoryItems)'
      - name: Business report render regression
        run: php artisan test tests/Feature/Reports/ReportPagesRenderTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare mobile UI fixtures
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force
          php artisan db:seed --class=DefaultDataSeeder --force
          php artisan db:seed --class=SuperAdminSeeder --force
          set +e
          php artisan db:seed --class=DemoDataSeeder --force > /tmp/mobile-seed.log 2>&1
          SEED_STATUS=$?
          set -e
          cat /tmp/mobile-seed.log
          if [ "$SEED_STATUS" -ne 0 ] && ! grep -q 'This Pay Run overlaps Pay Run #1' /tmp/mobile-seed.log; then exit "$SEED_STATUS"; fi
          php artisan tinker --execute="\App\Models\Setting::set('enabled_admin_modules', json_encode(array_keys(\App\Support\AdminModules::definitions())));"
          npm run build
      - name: Mobile and desktop browser checks
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/mobile-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/admin/login >/dev/null && break; sleep 2; done
          npx playwright test --config=playwright.mobile-reports.config.ts || { cat /tmp/mobile-server.log; tail -n 150 storage/logs/laravel.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-report-pass
          path: tests/Browser/output
