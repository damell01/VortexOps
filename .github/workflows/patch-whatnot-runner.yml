name: Patch Whatnot backend router

on:
  push:
    branches: [Dev]
    paths:
      - .github/workflows/patch-whatnot-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Wire backend router without replacing service file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Services/WhatnotScraper.php')
          s = p.read_text()
          old = "$this->scriptPath = base_path('scripts/whatnot-scraper.cjs');"
          new = "$this->scriptPath = base_path('scripts/whatnot-runner.cjs');"
          if old not in s:
              raise SystemExit('Expected WhatnotScraper scriptPath line was not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/WhatnotScraper.php
          git commit -m "feat(scraper): route built-in Whatnot scraper by backend"
          git push origin HEAD:Dev
