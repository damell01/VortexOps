name: One-time Whatnot exact role markup

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-exact-role-markup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0
      - name: Patch exact role switch markup
        run: |
          python3 .github/scripts/patch-whatnot-exact-role.py
          node --check scripts/whatnot-scraper.cjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/whatnot-scraper.cjs
          git commit -m 'fix(scraper): use current Whatnot role picker markup'
          git push origin HEAD:Dev
