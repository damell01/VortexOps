name: One-time Whatnot sync hardening

on:
  push:
    branches: [Dev]
    paths:
      - '.github/workflows/one-time-whatnot-sync-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Patch scraper service
        shell: bash
        run: |
          echo '' | base64 -d | python3
          php -l app/Services/WhatnotScraper.php

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app/Services/WhatnotScraper.php; then
            echo 'No scraper service changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Services/WhatnotScraper.php
          git commit -m 'fix(scraper): fail sync stages on channel-context errors'
          git push origin HEAD:Dev
