name: Native show filter verification
'on':
  push:
    branches:
    - audit/native-order-filter
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 60s
        command_timeout: 600s
        script: "set -eu\ncd /var/www/vortexops\nTARGET=14cfb06b9dfb092396d2ed747cdf24e8b98cc035\n\
          git diff --quiet\ngit diff --cached --quiet\ngit fetch origin Production\n\
          [ \"$(git rev-parse origin/Production)\" = \"$TARGET\" ] || { echo ORDER_RELEASE_BRANCH_ADVANCED;\
          \ exit 1; }\nOLD=$(git rev-parse HEAD)\ngit diff --name-only \"$OLD\" \"\
          $TARGET\" | while IFS= read -r FILE; do\ncase \"$FILE\" in\n.github/workflows/order-source-evidence.yml|app/Services/WhatnotScraper.php|scripts/whatnot-orders-hardened.py|tests/Feature/Console/WhatnotExitCodeTest.php|tests/Python/test_order_filter_routing.py)\
          \ ;;\n*) echo ORDER_RELEASE_UNRELATED_CHANGE; exit 1 ;;\nesac\ndone\ntrap\
          \ 'git checkout -B Production \"$OLD\"' EXIT\ngit checkout -B Production\
          \ \"$TARGET\"\npython3 -m unittest discover -s tests/Python -p 'test_order*.py'\n\
          python3 -m py_compile scripts/whatnot-orders-hardened.py\nphp -l app/Services/WhatnotScraper.php\n\
          trap - EXIT\necho ORDER_NATIVE_FILTER_RELEASED\nAUDIT_FILE=$(mktemp /var/www/vortexops/storage/framework/order-probe.XXXXXX.php)\n\
          trap 'rm -f \"$AUDIT_FILE\"' EXIT\ncat > \"$AUDIT_FILE\" <<'PHP'\n<?php\n\
          try {\n    require '/var/www/vortexops/vendor/autoload.php';\n    $app =\
          \ require '/var/www/vortexops/bootstrap/app.php';\n    $app->make(Illuminate\\\
          Contracts\\Console\\Kernel::class)->bootstrap();\n    config(['vortex.whatnot.browser_lock_fail_fast'\
          \ => false, 'vortex.whatnot.browser_lock_wait' => 180, 'vortex.whatnot.runtime_deadline'\
          \ => microtime(true) + 540]);\n    putenv('WHATNOT_BROWSER_LOCK_WAIT=120');\n\
          \    $out = new Symfony\\Component\\Console\\Output\\BufferedOutput();\n\
          \    $exit = Illuminate\\Support\\Facades\\Artisan::call('whatnot:probe-order-filter',\
          \ [], $out);\n    $content = $out->fetch();\n    foreach (explode(\"\\n\"\
          ,$content) as $line) {\n        if (preg_match('/ORDER_SOURCE_EVIDENCE (\\\
          [.*\\])/', $line, $m)) {\n            $metadata = json_decode($m[1], true);\n\
          \            if (is_array($metadata)) foreach ($metadata as $evidence) {\n\
          \                if (!isset($evidence['variables'])) continue;\n       \
          \         $paths = array_values(array_map(fn($v) => $v['path'], array_filter($evidence['variables'],\
          \ fn($v) => $v['matches_expected_live'] ?? false)));\n                $sourcePaths\
          \ = array_values(array_map(fn($v) => $v['path'], array_filter($evidence['response'],\
          \ fn($v) => $v['matches_expected_live'] ?? false)));\n                echo\
          \ 'ORDER_FILTER_MATCHES '.json_encode(['request_paths'=>$paths, 'response_paths'=>$sourcePaths]).\"\
          \\n\";\n            }\n        }\n    }\n    echo 'ORDER_PROBE_EXIT '.$exit.\"\
          \\n\";\n    foreach (['ORDER_SOURCE_FILTER_COLLISION', 'CLOUDFLARE_CHALLENGE',\
          \ 'LOGIN_REQUIRED', 'BROWSER_LOCK_TIMEOUT', 'SOURCE FILTER FAILED', 'SOURCE_FILTER_UNTRUSTED',\
          \ 'AUTH_REQUIRED', 'CHANNEL_CONTEXT_MISMATCH', 'CHANNEL_SWITCH_FAILED',\
          \ 'CHANNEL_SWITCH_', 'Cloudflare', 'CHALLENGE', 'SELECTOR_MISS', 'Timed\
          \ out', 'timed out', 'timeout', 'window ended', 'already active', 'INCONCLUSIVE',\
          \ 'Could not auto-select', 'No orders were imported'] as $flag) {\n    \
          \    if (stripos($content, $flag) !== false) echo 'ORDER_PROBE_SIGNAL '.$flag.\"\
          \\n\";\n    }\n    if (preg_match('/\\{\\s*\"show_order_counts\"\\s*:.*?\\\
          }\\s*(?:,\\s*\"overlapping_order_ids\"\\s*:\\s*\\d+\\s*\\})?/s', $content,\
          \ $m)) {\n        $data = json_decode($m[0], true);\n        if ($data)\
          \ echo 'ORDER_PROBE_COUNTS '.json_encode(['counts' => array_values($data['show_order_counts']),\
          \ 'overlap' => $data['overlapping_order_ids'] ?? null]).\"\\n\";\n    }\n\
          \    echo \"ORDER_PROBE_IMPORTS_PERFORMED 0\\n\";\n} catch (Throwable $e)\
          \ {\n    echo 'ORDER_PROBE_ERROR_CLASS '.get_class($e).\"\\n\";\n    foreach\
          \ (['AUTH_REQUIRED','CHANNEL_SWITCH','Cloudflare','timeout','already active']\
          \ as $flag) if (stripos($e->getMessage(),$flag)!==false) echo 'ORDER_PROBE_SIGNAL\
          \ '.$flag.\"\\n\";\n    exit(1);\n}\n\nPHP\nphp \"$AUDIT_FILE\"\n"
