services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # APP_IMAGE defaults to vortexops:local for local builds.
    # On the VPS set APP_IMAGE=ghcr.io/damell01/vortexops:latest in .env.docker
    # so docker compose pull/up fetch from GHCR without needing source code.
    image: ${APP_IMAGE:-vortexops:local}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-vortexops}
      DB_USERNAME: ${DB_USERNAME:-vortexops}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CLIENT: phpredis
      FILESYSTEM_DISK: public
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WAIT_FOR_DB: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: ${APP_IMAGE:-vortexops:local}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-vortexops}
      DB_USERNAME: ${DB_USERNAME:-vortexops}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CLIENT: phpredis
      FILESYSTEM_DISK: public
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      RUN_MIGRATIONS: "false"
      WAIT_FOR_DB: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-jobs=500", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/html/storage

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M --max-connections=100
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vortexops}
      MYSQL_USER: ${DB_USERNAME:-vortexops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  scheduler:
    image: ${APP_IMAGE:-vortexops:local}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-vortexops}
      DB_USERNAME: ${DB_USERNAME:-vortexops}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CLIENT: phpredis
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
      WAIT_FOR_DB: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - app-storage:/var/www/html/storage

  ai-worker:
    image: ${APP_IMAGE:-vortexops:local}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-vortexops}
      DB_USERNAME: ${DB_USERNAME:-vortexops}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CLIENT: phpredis
      FILESYSTEM_DISK: public
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      RUN_MIGRATIONS: "false"
      WAIT_FOR_DB: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--queue=ai", "--sleep=5", "--tries=1", "--timeout=300"]
    volumes:
      - app-storage:/var/www/html/storage

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    # Auto-pull both the text model and the vision model on first start.
    # Both are needed: OLLAMA_MODEL for general AI, OLLAMA_VISION_MODEL for packing slip scanning.
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull $${OLLAMA_MODEL:-gemma2:2b} &&
             ollama pull $${OLLAMA_VISION_MODEL:-moondream} &&
             wait"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
    volumes:
      - ollama-data:/root/.ollama

volumes:
  app-storage:
  mysql-data:
  redis-data:
  ollama-data:
