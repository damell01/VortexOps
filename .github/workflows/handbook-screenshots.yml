name: Handbook UI Screenshots

on:
  pull_request:
    branches:
      - Dev
    paths:
      - 'app/**'
      - 'resources/**'
      - 'database/**'
      - 'routes/**'
      - 'tests/Browser/handbook-screenshot.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/handbook-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,exif,gd,intl,pcntl,pdo,pdo_sqlite,sqlite3,zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare application
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

          set +e
          SEED_OUTPUT="$(php artisan migrate:fresh --seed --force 2>&1)"
          SEED_STATUS=$?
          set -e
          printf '%s\n' "$SEED_OUTPUT"

          if [ "$SEED_STATUS" -ne 0 ]; then
            if printf '%s\n' "$SEED_OUTPUT" | grep -q "This Pay Run overlaps Pay Run #1"; then
              echo "Demo seeding reached the known historical Pay Run overlap after creating the operational screenshot fixtures; continuing with those fixtures."
            else
              echo "Unexpected database seed failure."
              exit "$SEED_STATUS"
            fi
          fi

          npm run build

      - name: Capture current handbook screenshots
        shell: bash
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/vortexops-handbook-screenshots.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/admin/login >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Laravel server never became ready"
            cat /tmp/vortexops-handbook-screenshots.log
            exit 1
          fi

          if ! npx playwright test tests/Browser/handbook-screenshot.spec.ts --project=desktop; then
            echo "--- Laravel server log ---"
            cat /tmp/vortexops-handbook-screenshots.log
            exit 1
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: handbook-ui-screenshots
          path: public/guide/manual/ops-*.png
          if-no-files-found: error

      - name: Commit refreshed screenshots to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide/manual/ops-*.png
          if git diff --cached --quiet; then
            echo "Handbook screenshots are already current."
            exit 0
          fi
          git commit -m "Refresh current handbook screenshots [handbook screenshots]"
          git push origin HEAD:${{ github.head_ref }}
